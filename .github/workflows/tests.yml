name: tests

on:
  pull_request:

permissions:
  actions: read
  contents: read

defaults:
  run:
    working-directory: frontend
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: "0"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        id: pnpm-install
        with:
          version: 9.4.0
          run_install: false

      - name: Generate .npmrc
        run: |
          pnpm config set @tiptap-pro:registry https://registry.tiptap.dev
          pnpm config set //registry.tiptap.dev/:_authToken ${{ secrets.TIPTAP_PRO_TOKEN }}
          pnpm config set auto-install-peers true

      - run: |
          # Les @open-ent/* sont publiés sur un tag MOBILE (2.5.30-patched) : le lock
          # fige une URL de tarball contenant le SHA du blob d'alors, que GitHub
          # Packages rejette en 409 après republication. On re-résout ces paquets.
          node scripts/refresh-open-ent-lock.mjs
          pnpm install --frozen-lockfile
      - run: pnpm exec nx test

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIPTAP_PRO_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
