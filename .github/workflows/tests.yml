name: tests

on:
  pull_request:

permissions:
  actions: read
  contents: read

defaults:
  run:
    working-directory: frontend
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: "0"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        id: pnpm-install
        with:
          version: 9.4.0
          run_install: false

      - name: Generate .npmrc
        run: |
          pnpm config set @tiptap-pro:registry https://registry.tiptap.dev
          pnpm config set //registry.tiptap.dev/:_authToken ${{ secrets.TIPTAP_PRO_TOKEN }}
          pnpm config set auto-install-peers true

      - name: Install frontend dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.OPENENT_PACKAGES_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TIPTAP_PRO_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
        run: |
          # Les @open-ent/* sont publiés sur un tag MOBILE (2.5.30-patched) : le lock
          # fige une URL de tarball contenant le SHA du blob d'alors, que GitHub
          # Packages rejette en 409 après republication. On re-résout ces paquets.
          node scripts/refresh-open-ent-lock.mjs
          # Le script vient de RETIRER ces résolutions : --frozen-lockfile refuserait
          # d'installer (« Broken lockfile: no entry for @open-ent/bootstrap »).
          pnpm install --no-frozen-lockfile

      - name: Run tests
        env:
          NODE_AUTH_TOKEN: ${{ secrets.OPENENT_PACKAGES_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TIPTAP_PRO_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
        run: pnpm exec nx test
